<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111513">
  <title>每日蛋白打卡</title>
  <style>
    :root{color-scheme:dark;--lime:#b8f34a;--bg:#0d100f;--panel:#111513;--muted:#8e9990;--line:rgba(255,255,255,.08)}
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--bg);color:#f4f7f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
    button{font:inherit;-webkit-tap-highlight-color:transparent}.app{max-width:680px;min-height:100dvh;margin:auto;background:var(--panel);box-shadow:0 20px 60px #0008}
    .head{display:flex;align-items:center;justify-content:space-between;padding:max(20px,env(safe-area-inset-top)) 20px 16px}.eyebrow{margin:0;color:#91a092;font-size:12px;font-weight:700;letter-spacing:.18em}.head h1{margin:5px 0 0;font-size:23px;letter-spacing:-.02em}.reset{width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:#aeb8af;font-size:22px;cursor:pointer}.reset:hover{background:#ffffff10;color:#fff}
    .hero-wrap{padding:0 16px}.hero{position:relative;min-height:218px;overflow:hidden;border:1px solid var(--line);border-radius:28px;background:radial-gradient(circle at 86% 24%,#b8f34a2b,transparent 34%),linear-gradient(135deg,#202820,#111713 72%);box-shadow:0 20px 50px #0004}.food-art{position:absolute;right:22px;top:26px;display:grid;grid-template-columns:repeat(2,58px);gap:10px;transform:rotate(4deg);opacity:.72}.food-art span{display:grid;place-items:center;width:58px;height:58px;border:1px solid #ffffff18;border-radius:18px;background:#ffffff0e;font-size:30px;box-shadow:0 12px 25px #0003}.food-art span:nth-child(2),.food-art span:nth-child(3){transform:translateY(14px)}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#121713 0%,#121713e8 56%,#12171322 100%)}.hero-content{position:relative;display:flex;min-height:218px;align-items:flex-end;justify-content:space-between;gap:14px;padding:20px}.hero-copy{align-self:flex-start;max-width:58%}.date{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid #ffffff1a;border-radius:999px;background:#0004;color:#d9e0da;font-size:14px}.dot{width:6px;height:6px;border-radius:50%;background:var(--lime)}.label{margin:20px 0 0;color:#aeb8af;font-size:14px}.protein{margin:3px 0 0;font-size:43px;font-weight:900;line-height:1;letter-spacing:-.05em}.protein small{margin-left:4px;color:#b8c0b9;font-size:16px;letter-spacing:0}.goal-copy{margin:12px 0 0;font-size:14px;font-weight:700}.goal-copy.good{color:var(--lime)}
    .ring{--p:0%;display:grid;place-items:center;flex:0 0 104px;width:104px;height:104px;padding:7px;border-radius:50%;background:conic-gradient(var(--lime) var(--p),#ffffff1f 0)}.ring-inner{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#151a16f2;text-align:center}.ring strong{display:block;font-size:20px}.ring small{display:block;margin-top:2px;color:#9da79f;font-size:11px}
    .section{padding:27px 16px 40px}.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin:0 4px 16px}.section h2{margin:0;font-size:18px}.hint{margin:5px 0 0;color:var(--muted);font-size:14px}.summary{text-align:right;font-size:14px;font-weight:800}.summary em{color:var(--lime);font-style:normal}.bar{width:80px;height:6px;margin-top:8px;overflow:hidden;border-radius:9px;background:#ffffff1a}.bar i{display:block;width:0;height:100%;border-radius:inherit;background:var(--lime);transition:width .2s}
    .list{display:grid;gap:10px}.row{display:flex;align-items:center;gap:12px;min-height:78px;padding:12px 14px;border:1px solid var(--line);border-radius:20px;background:#ffffff09;transition:.2s}.row.done{border-color:#b8f34a59;background:#b8f34a11}.food-icon{display:grid;place-items:center;flex:0 0 44px;width:44px;height:44px;border-radius:14px;font-size:21px}.food-info{min-width:0;flex:1}.food-info h3{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}.food-info p{margin:5px 0 0;color:#8f9a91;font-size:12.5px}.tag{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;background:#b8f34a1f;color:var(--lime);font-size:11px;vertical-align:2px}
    .stepper{display:flex;align-items:center;flex:0 0 auto;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:#0003}.stepper button,.check{display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:50%;color:#fff;cursor:pointer}.stepper button{background:#ffffff12}.stepper button:first-child{background:transparent;color:#98a29a}.stepper button:disabled{opacity:.25;cursor:default}.count{min-width:20px;text-align:center;font-size:14px;font-weight:900}.done .count{color:var(--lime)}.check{width:30px;height:30px;border:1px solid #ffffff33;background:#ffffff08}.check.on{border-color:var(--lime);background:var(--lime);color:#10140e}.note{display:flex;gap:11px;margin-top:18px;padding:14px 16px;border:1px solid #ffffff0f;border-radius:18px;background:#0003}.note b{display:block;font-size:14px}.note p{margin:5px 0 0;color:#7f8a82;font-size:12px;line-height:1.6}.save{color:var(--lime)}
    @media(max-width:400px){.hero-content{padding:17px}.ring{flex-basis:92px;width:92px;height:92px}.hero-copy{max-width:62%}.protein{font-size:38px}.row{gap:9px;padding:11px}.food-icon{flex-basis:40px;width:40px;height:40px}.food-info p{font-size:12px}}
  </style>
  <link rel="stylesheet" href="./diary.css?v=2">
</head>
<body>
  <main class="app">
    <header class="head"><div><p class="eyebrow">DAILY FUEL</p><h1>每日蛋白打卡</h1></div><button class="reset" id="reset" aria-label="重置今日打卡">↻</button></header>
    <section class="hero-wrap"><div class="hero"><div class="food-art" aria-hidden="true"><span>🥛</span><span>🥚</span><span>🍞</span><span>🍗</span></div><div class="shade"></div><div class="hero-content"><div class="hero-copy"><div class="date"><i class="dot"></i><span id="date">今天</span></div><p class="label">今日估算蛋白质</p><p class="protein"><span id="protein">0</span><small>g</small></p><p class="goal-copy" id="goal">距 100g 还差 100g</p></div><div class="ring" id="ring"><div class="ring-inner"><div><strong id="percent">0%</strong><small>目标 100–110g</small></div></div></div></div></div></section>
    <section class="section"><div class="section-head"><div><h2>今日清单</h2><p class="hint">点按数量，完成后自动保存</p></div><div class="summary"><span><em id="done">0</em> / 7 项</span><div class="bar"><i id="bar"></i></div></div></div><div class="list" id="list"></div><div class="note"><span class="save">▣</span><div><b>当天记录已保存在这台设备</b><p>每天自动切换新清单；蛋白质为常见食材估算值，实际请以包装营养表和食堂份量为准。</p></div></div></section>
  </main>
  <script src="./data.js?v=2" defer></script>
  <script src="./app.js?v=2" defer></script>
</body>
</html>
